# CRIVO DE TOKENS NO CI — cole este arquivo em .github/workflows/ do PROJETO
# que consome o pacote (não é o workflow deste repositório).
#
# Sem isto, o crivo é um script que alguém precisa lembrar de rodar. Com isto,
# divergência de token vira build vermelho no PR, antes do merge — que é onde a
# LP de Segurança deveria ter sido pega.
name: DS
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx dialog-tokens-check
